name: RetailSphere CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
  RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: "Super Market ERP Backend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd "Super Market ERP Backend"
          npm ci

      - name: Lint
        run: |
          cd "Super Market ERP Backend"
          npm run lint || echo "Lint skipped"

      - name: Build
        run: |
          cd "Super Market ERP Backend"
          npm run build

      - name: Deploy to Render
        run: |
          curl -X POST "https://api.render.com/v1/services/${{ env.RENDER_SERVICE_ID }}/redeploy" \
            -H "Authorization: Bearer ${{ env.RENDER_API_KEY }}" \
            -H "Accept: application/json"

  frontend-ci:
    needs: backend-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: "Super Market ERP Frontend/package-lock.json"

      - name: Install Dependencies
        run: |
          cd "Super Market ERP Frontend"
          npm ci

      - name: Build
        run: |
          cd "Super Market ERP Frontend"
          npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel
          cd "Super Market ERP Frontend"
          vercel --prod --yes --token $VERCEL_TOKEN
